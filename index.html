<style>

<script>
const C=document.getElementById('c'),X=C.getContext('2d'),W=960,H=540,$=id=>document.getElementById(id);
const R=(a,b)=>a+Math.random()*(b-a),RI=n=>Math.floor(Math.random()*n),cl=(v,a,b)=>Math.max(a,Math.min(b,v)),lp=(a,b,t)=>a+(b-a)*t,ez=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const PALE='#d9d3c6',BLK='#17121c',FY=498,LX=450,LY=293;let T=0,last=0;
const DR=[['Trà đá','#d09a3c',8],['Cà phê sữa','#7a4a2a',12],['Trà sữa','#d8b98a',15],['Nước chanh','#e6e36a',10],['Sinh tố dâu','#e8688a',18],['Nước mía','#b6d35a',9]],TP=['Không topping','Trân châu','Thạch'];
const CT=[
{n:'Khách bình thường',skin:'#e8b894',cl:'#4a7fb5',hr:'#4a2e1a',say:['Hả…?','Ủa?','Chắc gió thôi.'],hi:'Cho mình 1 ly nhé!',ex:'calm'},
{n:'Khách nhát gan',skin:'#f0d6bc',cl:'#6aa56a',hr:'#8a5a2a',say:['AAAAA!!','Mẹ ơi!!','Hức…'],hi:'X-xin lỗi… cho tôi…',ex:'scared'},
{n:'Khách tò mò',skin:'#dca77c',cl:'#e0b020',hr:'#222',say:['Ồ? Nhìn kìa!','Hay quá…','Cho nhìn thử!'],hi:'Trong đó có gì vậy?',ex:'curious'},
{n:'Khách nóng tính',skin:'#e0a080',cl:'#c0392b',hr:'#222',say:['Gì đấy hả?!','Đùa tôi à?!','Mau lên!!'],hi:'Có ai không?!',ex:'angry'},
{n:'Khách vội vàng',skin:'#e8c4a0',cl:'#d8d8e0',hr:'#333',say:['Nhanh lên!','Trễ giờ rồi!','…Kệ.'],hi:'Gấp lắm, nhanh giúp!',ex:'angry'},
{n:'Khách kỳ quái',skin:'#a9c79a',cl:'#7a3f9a',hr:'#111',say:['Hi hi hi…','Dễ thương ghê.','Ta thích chỗ này.'],hi:'Cho ta thứ… ngọt ngọt.',ex:'happy'},
{n:'Khách quen',skin:'#d9a37a',cl:'#8a6a3a',hr:'#bbb',say:['Chào cậu nhé!','Vẫn thế thôi.','Hôm nay vui nhỉ.'],hi:'Như mọi khi nhé.',ex:'happy'},
{n:'Khách bí ẩn',skin:'#000',cl:'#1c1626',hr:'#000',say:['…','…','…'],hi:'(đưa tờ giấy ghi món)',ex:'calm'}];
const G={phase:'title',paused:false,day:1,total:0,best:0,n:0,ok:0,sm:0,cust:null,ev:null,sc:null,say:null,shut:0,shutT:0,sp:2,up:{lamp:0,cup:0,cab:0,charm:0},ach:[],fear:0,fcd:0,streak:0,seen:{},mx:0,hb:0,warn:0,shake:0,tug:0,rel:0,idle:3,lastT:-1,lastEv:'',lastL:'',set:{gentle:false},fl:null,cs:{dx:0},dip:-9,nk:0};

try{const s=JSON.parse(localStorage.getItem('btam')||'{}');G.sv=s;G.best=s.best||0;Object.assign(G.up,s.up||{});G.ach=s.ach||[]}catch(e){G.sv={}}
function save(){try{localStorage.setItem('btam',JSON.stringify({day:G.day,total:G.total,best:G.best,up:G.up,ach:G.ach}))}catch(e){}}
/* ===== AUDIO ===== */
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();o.type='sawtooth';o.frequency.value=48;f.frequency.value=130;o.connect(f);f.connect(g);g.connect(AC.destination);g.gain.value=0;o.start();amb=g}catch(e){AC=null}}if(AC&&AC.state==='suspended')AC.resume();return AC}
const ou=()=>mute?0:vol;
function tone(f,d,ty='sine',g=.2,sl=0,dl=0){const a=ac();if(!a)return;const t=a.currentTime+dl,o=a.createOscillator(),v=a.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+sl),t+d);v.gain.setValueAtTime(Math.max(.0002,g*ou()),t);v.gain.exponentialRampToValueAtTime(.0002,t+d);o.connect(v);v.connect(a.destination);o.start(t);o.stop(t+d+.05)}
function noise(d,ft,fq,g=.2,dl=0,sw=0){const a=ac();if(!a)return;const t=a.currentTime+dl,b=a.createBuffer(1,Math.floor(a.sampleRate*d),a.sampleRate),k=b.getChannelData(0);for(let i=0;i<k.length;i++)k[i]=Math.random()*2-1;const s=a.createBufferSource(),f=a.createBiquadFilter(),v=a.createGain();s.buffer=b;f.type=ft;f.frequency.setValueAtTime(fq,t);if(sw)f.frequency.linearRampToValueAtTime(Math.max(50,fq+sw),t+d);v.gain.setValueAtTime(Math.max(.0002,g*ou()),t);v.gain.exponentialRampToValueAtTime(.0002,t+d);s.connect(f);f.connect(v);v.connect(a.destination);s.start(t)}
function setAmb(v){if(AC&&amb)amb.gain.linearRampToValueAtTime(v*ou(),AC.currentTime+.8)}
const sfx={knock(){for(let i=0;i<3;i++){tone(150,.12,'sine',.5,-90,i*.2);noise(.07,'lowpass',500,.4,i*.2)}},bell(){tone(880,1.3,'sine',.15);tone(1320,1,'sine',.1);tone(1760,.8,'sine',.05)},scratch(){noise(.8,'highpass',1500,.14,0,2500)},drag(){noise(1,'lowpass',400,.28,0,300)},slam(){noise(.25,'lowpass',900,.7);tone(70,.3,'sine',.7,-30)},giggle(){for(let i=0;i<5;i++)tone(650+RI(300),.07,'square',.06,200,i*.11)},cup(){tone(300,.08,'triangle',.3,-80)},whisper(){noise(1.3,'bandpass',2500,.09,0,-900)},coin(){tone(988,.1,'square',.1);tone(1319,.2,'square',.1,0,.09)},scream(){tone(900,.4,'sawtooth',.1,500)},thud(){tone(90,.15,'sine',.55,-40)},whoosh(){noise(.2,'bandpass',1200,.3,0,2000)}};
/* ===== DRAW HELPERS ===== */
function rr(x,y,w,h,r){X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath()}
function limb(x0,y0,x1,y1,w0,w1,col,n,fl,claw,wig){const a=Math.atan2(y1-y0,x1-x0),nx=-Math.sin(a),ny=Math.cos(a);X.fillStyle=col;X.strokeStyle='#0a070c';X.lineWidth=3;X.lineJoin='round';X.lineCap='round';
X.beginPath();X.moveTo(x0+nx*w0,y0+ny*w0);X.lineTo(x1+nx*w1,y1+ny*w1);X.lineTo(x1-nx*w1,y1-ny*w1);X.lineTo(x0-nx*w0,y0-ny*w0);X.closePath();X.fill();X.stroke();
X.beginPath();X.ellipse(x1,y1,w1*1.2,w1*1.05,a,0,7);X.fill();X.stroke();
const bx=x1+Math.cos(a)*w1*.8,by=y1+Math.sin(a)*w1*.8,fw=Math.max(3,Math.min(9,w1*1.7/n));
for(let i=0;i<n;i++){const o=n>1?i/(n-1)-.5:0,fa=a+o*Math.min(1.8,.2*n)+Math.sin(T*6+i*1.7)*(wig||.1),sx=bx+nx*o*w1*1.7,sy=by+ny*o*w1*1.7,l=fl*(1-Math.abs(o)*.35),ex=sx+Math.cos(fa)*l,ey=sy+Math.sin(fa)*l;
X.strokeStyle='#0a070c';X.lineWidth=fw+4;X.beginPath();X.moveTo(sx,sy);X.lineTo(ex,ey);X.stroke();X.strokeStyle=col;X.lineWidth=fw;X.beginPath();X.moveTo(sx,sy);X.lineTo(ex,ey);X.stroke();
if(claw){const px=-Math.sin(fa),py=Math.cos(fa);X.fillStyle='#050305';X.beginPath();X.moveTo(ex+px*fw*.6,ey+py*fw*.6);X.lineTo(ex-px*fw*.6,ey-py*fw*.6);X.lineTo(ex+Math.cos(fa)*17,ey+Math.sin(fa)*17);X.fill()}}}
function cp(c){c.beginPath();c.moveTo(-20,-56);c.lineTo(20,-56);c.lineTo(14,0);c.lineTo(-14,0);c.closePath()}
function cup(c,x,y,s,d,ice,top,lid,sq){c.save();c.translate(x,y);c.scale(s*(sq||1),s);cp(c);c.fillStyle='rgba(235,235,250,.22)';c.fill();
if(d>=0){c.save();cp(c);c.clip();c.fillStyle=DR[d][1];c.fillRect(-22,-46,44,46);
if(ice){c.fillStyle='rgba(255,255,255,.7)';[[-9,-36],[5,-40],[-2,-24],[-8,-12],[7,-16]].forEach(a=>c.fillRect(a[0],a[1],10,10))}
if(top==1){c.fillStyle='#111';[-9,-3,3,9,-6,6].forEach((a,i)=>{c.beginPath();c.arc(a,-4-(i>3?7:0),3.5,0,7);c.fill()})}
if(top==2){c.fillStyle='#5fd08a';[-9,-3,3,9].forEach(a=>c.fillRect(a-2.5,-8,5,5))}c.restore()}
cp(c);c.strokeStyle=G.up.cup?'#f5d76e':'#eef';c.lineWidth=2.5;c.stroke();
c.strokeStyle='#d33';c.lineWidth=4;c.beginPath();c.moveTo(6,-56);c.lineTo(15,-84);c.stroke();
if(lid){c.fillStyle='#e8e8f4';c.strokeStyle='#445';c.lineWidth=2;c.beginPath();c.ellipse(0,-57,22,6,0,0,7);c.fill();c.stroke()}c.restore()}
function once(k,f){const e=G.ev;if(e&&!e.fx[k]){e.fx[k]=1;f()}}
const cxx=()=>G.cust?G.cust.x+G.cs.dx:240;
function held(x,y){const m=G.made||{d:2,i:1,t:1};cup(X,x,y,1,m.d,m.i,m.t,true)}
function eye(cx,cy,rx,ry,op,big){X.save();X.fillStyle='#e9e4d6';X.strokeStyle='#000';X.lineWidth=3;X.beginPath();X.ellipse(cx,cy,rx,ry*op,0,0,7);X.fill();X.stroke();
if(op>.1){X.save();X.beginPath();X.ellipse(cx,cy,rx,ry*op,0,0,7);X.clip();
X.strokeStyle='rgba(200,40,40,.6)';X.lineWidth=1.5;for(let i=0;i<9;i++){const a=i*.7;X.beginPath();X.moveTo(cx+Math.cos(a)*rx,cy+Math.sin(a)*ry);X.lineTo(cx+Math.cos(a)*rx*.5,cy+Math.sin(a)*ry*.5);X.stroke()}
const ix=cx+cl((cxx()-cx)*.15,-rx*.4,rx*.4),r=ry*.55;X.fillStyle='#b8842a';X.beginPath();X.arc(ix,cy,r,0,7);X.fill();X.fillStyle='#000';X.beginPath();X.ellipse(ix,cy,r*.35,r*.85,0,0,7);X.fill();X.fillStyle='#fff';X.beginPath();X.arc(ix-r*.3,cy-r*.3,r*.15,0,7);X.fill();X.restore()}X.restore()}
function inWin(f){X.save();X.beginPath();X.rect(395,185,170,108);X.clip();f();X.restore()}
function shutter(a){if(a<=0)return;const h=108*a;X.fillStyle='#4a3020';X.fillRect(395,185,170,h);X.strokeStyle='#2a1a10';X.lineWidth=2;for(let x=395;x<565;x+=21){X.beginPath();X.moveTo(x,185);X.lineTo(x,185+h);X.stroke()}X.fillStyle='#7a4a28';X.fillRect(395,185+h-7,170,7);X.fillStyle='#9a5a2a';for(let i=0;i<5;i++){X.beginPath();X.arc(410+i*35,185+h-3,2,0,7);X.fill()}X.strokeStyle='#caa24a';X.lineWidth=3;X.beginPath();X.arc(480,185+h+5,5,0,7);X.stroke()}
/* ===== EVENTS (18) l: s nhẹ / h mạnh / f hài ; u: k gõ cửa, d giao nước, i idle ===== */
const EV=[
{id:'long',n:'Tay dài bất thường',l:'h',u:'ki',dur:2.8,at:.9,h:1,d(p){const k=Math.pow(Math.sin(p*Math.PI),.6);once('a',sfx.drag);limb(490,250,490-(490-cxx()-45)*k,265+Math.sin(T*4)*5,7,9,PALE,5,28,0,.3)}},
{id:'many',n:'Tay nhiều ngón',l:'s',u:'ki',dur:2.6,at:.7,h:1,d(p){const k=ez(Math.min(1,Math.sin(p*Math.PI)*2));once('a',sfx.drag);limb(485,288,485+Math.sin(T*5)*16,284-70*k,18,22,PALE,11,32,0,.25)}},
{id:'claw',n:'Móng vuốt cào',l:'s',u:'ki',dur:2.6,at:.5,h:1,d(p){const k=Math.min(1,Math.sin(p*Math.PI)*3);once('a',sfx.scratch);limb(520,245,lp(520,470+Math.sin(T*9)*35,k),lp(250,285,k),10,13,BLK,4,30,1,.12)}},
{id:'eye',n:'Con mắt khổng lồ',l:'h',u:'ki',dur:3.2,at:1,d(p){inWin(()=>{const o=ez(Math.min(1,p*2.5))*(p>.85?1-(p-.85)/.15:1)*(p>.55&&p<.62?.1:1);eye(480,238,78,56,o)})}},
{id:'doll',n:'Đầu búp bê lăn',l:'h',u:'k',dur:3.4,at:.35,d(p){const q=ez(Math.min(1,p/.6));once('a',sfx.drag);let hx=480-70*q,hy=265-Math.abs(Math.sin(p*14))*14*(1-p)*(p<.6?1:0)+(p>.9?(p-.9)*1400*(p-.9):0),rot=-q*6.28+(p>.6?.3*Math.sin((p-.6)*6):0);
X.save();X.translate(hx,hy);X.rotate(rot);X.fillStyle='#efe6d8';X.strokeStyle='#000';X.lineWidth=3;X.beginPath();X.arc(0,0,30,0,7);X.fill();X.stroke();X.fillStyle='#111';X.beginPath();X.arc(0,-8,30,Math.PI,0);X.fill();X.fillStyle='#e8908a';X.beginPath();X.arc(-17,8,6,0,7);X.arc(17,8,6,0,7);X.fill();

/* ===== CỬA HÀNG / THÀNH TÍCH / SỢ HÃI ===== */
const UP=[['lamp','🏮 Đèn dầu ấm','Giảm 20% Sợ hãi mỗi cấp, đèn ít chập chờn',[40,90,160]],['cup','🥤 Ly pha lê','+2k tiền boa mỗi đơn, mỗi cấp',[30,70,130]],['cab','🗄️ Tủ pha chế','Thêm 4 giây cho thưởng pha nhanh, mỗi cấp',[35,80,140]],['charm','🧿 Bùa bình an','Sợ hãi hồi nhanh hơn, hít thở mạnh hơn',[50,110,180]]];
const AL=[['first','🥤 Ly đầu tiên','Giao thành công một ly nước'],['perf3','🎯 Tay nghề','3 đơn hoàn hảo liên tiếp'],['face','😶 Gan dạ','Phục vụ khách ngay sau khi Khuôn mặt hiện ra'],['rich','💰 Chủ quán','Có 200k trong tay'],['shift','🌙 Sống sót','Hoàn thành một ca'],['calm','🧘 Bình tĩnh','Hết ca mà Sợ hãi không vượt 70%'],['shop','🛒 Biết đầu tư','Mua nâng cấp đầu tiên'],['seen','👥 Quen mặt','Gặp cả 8 kiểu khách trong một lần chơi']];
function toast(s){$('toast').textContent=s;show('toast',1);clearTimeout(toast.t);toast.t=setTimeout(()=>show('toast',0),2600)}
function ach(id){if(G.ach.includes(id))return;G.ach.push(id);const a=AL.find(x=>x[0]===id);toast('🏆 '+a[1]+' – '+a[2]);save()}
function chk(pay){if(pay>0)ach('first');if(G.streak>=3)ach('perf3');if(pay>0&&G.sawFace)ach('face');if(G.total>=200)ach('rich');if(Object.keys(G.seen).length>=8)ach('seen')}
function addFear(l){G.fear=Math.min(100,G.fear+(l>=2?24:l>=1?12:6)*(1-.2*G.up.lamp));G.mx=Math.max(G.mx,G.fear);if(G.fear>=85&&!G.warn){G.warn=1;toast('😨 Sợ hãi sắp tràn! Hít thở khi cửa đóng')}}
function md(h){$('md').innerHTML=h;show('md',1)}
function openShop(){let h=`<h2 style='margin:.2em 0;color:var(--gd)'>🛒 Cửa hàng</h2><p>Tiền: <b>${G.total}k</b></p>`;UP.forEach(u=>{const lv=G.up[u[0]],mx=lv>=3,cost=u[3][lv];h+=`<div style='margin:.5em 0;text-align:left'><b>${u[1]}</b> (cấp ${lv}/3)<br><small>${u[2]}</small><br><button class=b data-a='u${u[0]}' ${mx||G.total<cost?'disabled':''}>${mx?'Đã tối đa':'Mua '+cost+'k'}</button></div>`});md(h+'<button class=b data-a=x>Đóng</button>')}
function openAch(){let h=`<h2 style='margin:.2em 0;color:var(--gd)'>🏆 Thành tích (${G.ach.length}/${AL.length})</h2>`;AL.forEach(a=>{const ok=G.ach.includes(a[0]);h+=`<div style='margin:.4em 0;text-align:left;opacity:${ok?1:.5}'>${ok?'✅':'🔒'} <b>${a[1]}</b><br><small>${a[2]}</small></div>`});md(h+'<button class=b data-a=x>Đóng</button>')}
function mdo(a){if(a==='x'){show('md',0);return}if(a[0]==='u'){const u=UP.find(x=>x[0]===a.slice(1));if(!u)return;const lv=G.up[u[0]],cost=u[3][lv];if(lv>=3||G.total<cost)return;G.total-=cost;G.up[u[0]]++;sfx.coin();ach('shop');save();hud();openShop()}}
/* ===== MENU / INPUT ===== */
function menuOpen(){const has=G.started||(G.sv&&(G.sv.total>0||G.sv.day>1));$('mc2').disabled=!has;show('menu',1)}
function pause(){if(!G.started||G.paused||G.phase==='sum'||G.phase==='title')return;G.paused=true;menuOpen()}
$('mn').onclick=()=>{ac();G.total=0;G.started=false;G.paused=false;startShift(1)};
$('mc2').onclick=()=>{ac();if(G.paused){G.paused=false;show('menu',0)}else if(G.started){show('menu',0)}else{G.total=G.sv.total||0;startShift(G.sv.day||1)}};
$('ms').onclick=()=>show('set',$('set').classList.contains('h'));
function snd(){mute=!mute;$('bs').textContent=mute?'🔇':'🔊';$('ma').textContent='🔊 Âm thanh: '+(mute?'Tắt':'Bật');if(AC&&amb)amb.gain.value=mute?0:amb.gain.value}
$('ma').onclick=snd;$('bs').onclick=snd;$('bp').onclick=pause;
$('vol').oninput=e=>{vol=e.target.value/100};$('gen').onchange=e=>{G.set.gentle=e.target.checked};
$('rs').onclick=()=>{G.sv={};G.best=0;G.up={lamp:0,cup:0,cab:0,charm:0};G.ach=[];G.total=0;try{localStorage.removeItem('btam')}catch(e){}if(!G.started)$('mc2').disabled=true};
$('kn').onclick=act;
$('mshop').onclick=openShop;$('mach').onclick=openAch;$('md').onclick=e=>{const b=e.target.closest('button');if(b)mdo(b.dataset.a)};
const fsE=$('w');if(!(document.fullscreenEnabled||document.webkitFullscreenEnabled))$('bf').classList.add('h');
$('bf').onclick=()=>{try{if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}else{(fsE.requestFullscreen||fsE.webkitRequestFullscreen).call(fsE);try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}}}catch(e){}};
C.addEventListener('pointerdown',e=>{const r=C.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;const ph=G.phase;if(ph==='ready'&&x>380&&x<590&&y>170&&y<320)act();else if(ph==='take'&&Math.hypot(x-LX,y-LY+25)<55)act();else if(ph==='dev'&&G.ev&&G.ev.tug&&x>380&&x<590&&y>170&&y<330)act()});
addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('md').classList.contains('h')){show('md',0);return}if(G.paused){G.paused=false;show('menu',0)}else pause();return}if(G.paused||G.phase==='title')return;if(e.code==='Space'){e.preventDefault();act()}
else if(G.phase==='prep'&&/^[1-6]$/.test(e.key)){const n=+e.key-1;if(P.step===0)pdo('d'+n);else if(P.step===1&&n<2)pdo(n===0?'i1':'i0');else if(P.step===2&&n<3)pdo('t'+n)}});
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(!G.paused){T+=dt;update(dt)}render();requestAnimationFrame(loop)}
bg();menuOpen();requestAnimationFrame(loop);
try{document.fonts.load('bold 19px "Noto Serif"','BÀN TAY ẨN MÌNH Bắt Đầu Chơi Tiếp Bóng tối').then(bg)}catch(e){}
</script></body></html>
